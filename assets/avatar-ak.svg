<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Data Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="0" y1="40" x2="400" y2="400"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>

  <!-- Glowing Accent Circles -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="125" fill="#13192b" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Data Nodes / Circuit Dots -->
  <circle cx="95" cy="140" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="305" cy="140" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="110" cy="270" r="5" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="290" cy="270" r="5" fill="#06b6d4" filter="url(#glow)"/>
  
  <path d="M 95 140 Q 140 180 160 190" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 305 140 Q 260 180 240 190" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Initials "AK" -->
  <text x="200" y="215" font-family="'Space Grotesk', system-ui, sans-serif" font-size="78" font-weight="800" text-anchor="middle" fill="url(#textGrad)" letter-spacing="4">
    AK
  </text>

  <!-- Subtitle pill inside graphic -->
  <rect x="110" y="240" width="180" height="26" rx="13" fill="#1e1b4b" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
  <text x="200" y="258" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#a78bfa" letter-spacing="2">
    DATA ANALYST
  </text>
</svg>
