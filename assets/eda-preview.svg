    <rect x="14" y="32" width="24" height="16" rx="2" fill="#8b5cf6" opacity="0.95"/>
    <rect x="42" y="32" width="24" height="16" rx="2" fill="#06b6d4" opacity="0.65"/>
    <rect x="70" y="32" width="24" height="16" rx="2" fill="#6366f1" opacity="0.8"/>
    <rect x="98" y="32" width="24" height="16" rx="2" fill="#ec4899" opacity="0.5"/>
    <rect x="126" y="32" width="24" height="16" rx="2" fill="#8b5cf6" opacity="0.3"/>

    <rect x="14" y="52" width="24" height="16" rx="2" fill="#06b6d4" opacity="0.65"/>
    <rect x="42" y="52" width="24" height="16" rx="2" fill="#8b5cf6" opacity="0.95"/>
    <rect x="70" y="52" width="24" height="16" rx="2" fill="#06b6d4" opacity="0.45"/>
    <rect x="98" y="52" width="24" height="16" rx="2" fill="#8b5cf6" opacity="0.75"/>
    <rect x="126" y="52" width="24" height="16" rx="2" fill="#ec4899" opacity="0.4"/>

    <rect x="14" y="72" width="24" height="16" rx="2" fill="#6366f1" opacity="0.8"/>
    <rect x="42" y="72" width="24" height="16" rx="2" fill="#06b6d4" opacity="0.45"/>
    <rect x="70" y="72" width="24" height="16" rx="2" fill="#8b5cf6" opacity="0.95"/>
    <rect x="98" y="72" width="24" height="16" rx="2" fill="#06b6d4" opacity="0.55"/>
    <rect x="126" y="72" width="24" height="16" rx="2" fill="#6366f1" opacity="0.85"/>
  </g>

  <!-- Right Bottom Box: Summary Metrics -->
  <g transform="translate(370, 192)">
    <rect x="0" y="0" width="185" height="103" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="14" y="20" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700">Data Quality Metrics</text>
    
    <rect x="14" y="32" width="72" height="30" rx="6" fill="#1e1b4b"/>
    <text x="20" y="44" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600">CLEANED</text>
    <text x="20" y="56" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">100% Valid</text>

    <rect x="94" y="32" width="75" height="30" rx="6" fill="#0c4a6e"/>
    <text x="100" y="44" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600">OUTLIERS</text>
    <text x="100" y="56" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">IQR Filtered</text>

    <!-- Tech tags -->
    <text x="14" y="85" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8">✓ df.describe() • sns.pairplot()</text>
  </g>
