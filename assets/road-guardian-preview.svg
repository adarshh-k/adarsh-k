<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roadLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="roadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="340" fill="url(#roadBg)" rx="16"/>

  <!-- Perspective Road Map Lines -->
  <g opacity="0.25">
    <path d="M 0 280 L 600 280" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 0 310 L 600 310" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 220 180 L 120 340" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 380 180 L 480 340" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 300 180 L 300 340" stroke="#06b6d4" stroke-width="2" stroke-dasharray="12 12"/>
  </g>

  <!-- Stylized Android Smartphone Display -->
  <g transform="translate(195, 30)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="210" height="280" rx="24" fill="url(#phoneGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <!-- Phone Screen -->
    <rect x="8" y="10" width="194" height="260" rx="18" fill="#090e17"/>
    <!-- App Header Bar -->
    <rect x="8" y="10" width="194" height="38" rx="14" fill="#1e1b4b"/>
    <circle cx="28" cy="29" r="8" fill="#8b5cf6"/>
    <text x="44" y="33" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ROAD GUARDIAN</text>
    
    <!-- Issue Alert Card inside App -->
    <rect x="18" y="58" width="174" height="60" rx="10" fill="#172033" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
    <circle cx="34" cy="78" r="10" fill="#f43f5e" opacity="0.2"/>
    <path d="M 34 72 L 34 80 M 34 83 L 34 84" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="74" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Road Damage Detected</text>
    <text x="52" y="87" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Pothole / Surface Crack</text>
    <rect x="52" y="94" width="70" height="14" rx="4" fill="#0284c7" opacity="0.25"/>
    <text x="58" y="104" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="7" font-weight="600">GPS Geo-Tagged</text>

    <!-- Photo Capture Preview Box -->
    <rect x="18" y="126" width="174" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Camera icon / imagery representation -->
    <circle cx="105" cy="155" r="18" fill="#1e293b"/>
    <path d="M 97 155 A 8 8 0 0 1 113 155 A 8 8 0 0 1 97 155" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="105" cy="155" r="3" fill="#38bdf8"/>
    <text x="105" y="188" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Photo Evidence Attached</text>

    <!-- Submit / Resolved Status Pill -->
    <rect x="18" y="208" width="174" height="28" rx="8" fill="#059669" opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="32" cy="222" r="5" fill="#10b981"/>
    <text x="44" y="226" fill="#10b981" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">STATUS: REPORT SUBMITTED</text>
    <text x="160" y="226" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="8">✓</text>
  </g>

  <!-- Left Side Badges -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="135" height="42" rx="10" fill="#131b2e" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
    <text x="14" y="18" fill="#8b5cf6" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">PLATFORM</text>
    <text x="14" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Android Studio</text>
  </g>

  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="135" height="42" rx="10" fill="#131b2e" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <text x="14" y="18" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">CORE MODULE</text>
    <text x="14" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Geo & Photo Report</text>
  </g>

  <!-- Right Side Badges -->
  <g transform="translate(435, 80)">
    <rect x="0" y="0" width="135" height="42" rx="10" fill="#131b2e" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="14" y="18" fill="#10b981" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">LIFECYCLE</text>
    <text x="14" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Notification Alert</text>
  </g>

  <g transform="translate(435, 140)">
    <rect x="0" y="0" width="135" height="42" rx="10" fill="#131b2e" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
    <text x="14" y="18" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">TYPE</text>
    <text x="14" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">B.Sc. Degree Project</text>
  </g>
</svg>
