<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="sqlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="dbCyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="340" fill="url(#sqlBg)" rx="16"/>

  <!-- SQL IDE Console Container -->
  <rect x="25" y="25" width="550" height="290" rx="14" fill="#090e17" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Console Header -->
  <rect x="25" y="25" width="550" height="40" rx="14" fill="#111827"/>
  <circle cx="48" cy="45" r="5" fill="#f43f5e"/>
  <circle cx="64" cy="45" r="5" fill="#eab308"/>
  <circle cx="80" cy="45" r="5" fill="#10b981"/>
  <text x="110" y="49" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">MySQL Workbench / Query Console — [analysis_query.sql]</text>

  <!-- Left: SQL Query Code Block -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="295" height="215" rx="10" fill="#0c1222" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#ec4899" font-weight="700">WITH </tspan>
      <tspan fill="#f8fafc">MonthlySummary </tspan>
      <tspan fill="#ec4899" font-weight="700">AS </tspan>
      <tspan fill="#94a3b8">(</tspan>
    </text>

    <text x="28" y="52" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#38bdf8" font-weight="700">SELECT </tspan>
      <tspan fill="#f8fafc">region_id, </tspan>
      <tspan fill="#818cf8">COUNT</tspan><tspan fill="#94a3b8">(*) </tspan>
      <tspan fill="#ec4899">AS </tspan><tspan fill="#f8fafc">total_leads,</tspan>
    </text>

    <text x="28" y="74" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#818cf8">ROUND</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#818cf8">AVG</tspan><tspan fill="#94a3b8">(revenue), 2) </tspan>
      <tspan fill="#ec4899">AS </tspan><tspan fill="#f8fafc">avg_rev</tspan>
    </text>

    <text x="28" y="96" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#38bdf8" font-weight="700">FROM </tspan>
      <tspan fill="#f8fafc">analytics_master_table</tspan>
    </text>

    <text x="28" y="118" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#a855f7" font-weight="700">INNER JOIN </tspan>
      <tspan fill="#f8fafc">regions </tspan>
      <tspan fill="#38bdf8" font-weight="700">ON </tspan><tspan fill="#f8fafc">master.r_id = r.id</tspan>
    </text>

    <text x="28" y="140" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#38bdf8" font-weight="700">GROUP BY </tspan>
      <tspan fill="#f8fafc">region_id</tspan>
    </text>

    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">)</text>

    <text x="16" y="184" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <tspan fill="#38bdf8" font-weight="700">SELECT * </tspan>
      <tspan fill="#38bdf8" font-weight="700">FROM </tspan><tspan fill="#f8fafc">MonthlySummary </tspan>
      <tspan fill="#38bdf8" font-weight="700">ORDER BY </tspan><tspan fill="#f8fafc">avg_rev </tspan><tspan fill="#ec4899">DESC;</tspan>
    </text>

    <rect x="16" y="196" width="130" height="12" rx="3" fill="#10b981" opacity="0.2"/>
    <text x="20" y="205" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="7.5">✓ 14 rows affected (0.002 sec)</text>
  </g>

  <!-- Right: Query Output Grid & Schema -->
  <g transform="translate(355, 80)">
    <rect x="0" y="0" width="200" height="215" rx="10" fill="#0c1222" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <text x="14" y="22" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Result Set Output</text>
    
    <!-- Table Header -->
    <rect x="10" y="32" width="180" height="22" rx="4" fill="#1e293b"/>
    <text x="18" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">REGION</text>
    <text x="75" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">LEADS</text>
    <text x="130" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">AVG_REV</text>

    <!-- Table Rows -->
    <rect x="10" y="58" width="180" height="20" rx="3" fill="#131b2e"/>
    <text x="18" y="72" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">North-01</text>
    <text x="75" y="72" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8">1,482</text>
    <text x="130" y="72" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8">$8,450.00</text>

    <rect x="10" y="82" width="180" height="20" rx="3" fill="#111827"/>
    <text x="18" y="96" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">South-04</text>
    <text x="75" y="96" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8">984</text>
    <text x="130" y="96" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8">$7,920.50</text>

    <rect x="10" y="106" width="180" height="20" rx="3" fill="#131b2e"/>
    <text x="18" y="120" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">West-02</text>
    <text x="75" y="120" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8">745</text>
    <text x="130" y="120" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8">$6,110.20</text>

    <!-- Capability Pills -->
    <g transform="translate(10, 138)">
      <rect x="0" y="0" width="180" height="66" rx="6" fill="#13192b" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="10" y="18" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700">TECHNIQUES DEMONSTRATED</text>
      <text x="10" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">• Multi-table Joins (INNER, LEFT)</text>
      <text x="10" y="47" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">• Aggregate Metrics (SUM, AVG)</text>
      <text x="10" y="60" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">• Subqueries &amp; CTE Analysis</text>
    </g>
  </g>
</svg>
